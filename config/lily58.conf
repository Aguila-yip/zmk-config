# ==============================================================================
#                      Allium58 / Lily58 完整設定檔
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 深度睡眠管理 (已為你開啟，解決 1 日冇電問題)
# ------------------------------------------------------------------------------
# 原本範本叫你 Uncomment 的深層睡眠（已為你掹走 # 號正式啟用！）
CONFIG_ZMK_SLEEP=y

# 閒置 30 秒進入輕度待機 (30000 ms)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# 閒置 15 分鐘完全冇摸過，進入深度睡眠 (900000 ms，耗電降至微安級)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# 電量每 2 個鐘（7200 秒）向電腦匯報一次（慳返平時發報電量嘅電）
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=7200


# ------------------------------------------------------------------------------
# 2. 藍牙發射功率與無線優化 (保留你的原本設定)
# ------------------------------------------------------------------------------
# Uncomment the following line to increase the keyboard's wireless range
# 將藍牙發射功率推到最強 (+8 dBm)，穿透力最強、最穩、最唔易斷線！
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 啟用低功耗藍牙實驗性省電優化
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y


# ------------------------------------------------------------------------------
# 3. 按鍵防抖手感設定 (保留你的原本設定)
# ------------------------------------------------------------------------------
# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10


# ------------------------------------------------------------------------------
# 4. 滑鼠與鼠標功能 (全新加入，安全無毒)
# ------------------------------------------------------------------------------
# 開啟滑鼠驅動支援（支援 &mmv 上下左右移動 及 &mkp 左右掣）
CONFIG_ZMK_POINTING=y


# ------------------------------------------------------------------------------
# 5. 防漏電保護 (極致慳電必備)
# ------------------------------------------------------------------------------
# 徹底切斷未使用的外設供電電路（防晶片腳位微小漏電）
CONFIG_ZMK_EXT_POWER=n

# 關閉 RGB 氛圍燈及背光驅動（防止背景程序偷食電量）
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n


# ------------------------------------------------------------------------------
# 6. ZMK Studio 即時改掣 (保持註解關閉，防止按鍵變 &none)
# ------------------------------------------------------------------------------
# Enable ZMK Studio for Realtime Keymap Updates
# (為免引發 NVS 暫存覆蓋主記憶體的 Bug，繼續保持 # 註解關閉！)
# CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=n


# ------------------------------------------------------------------------------
# 7. USB 除錯日誌 (保留你的原本設定，保持關閉以防食電)
# ------------------------------------------------------------------------------
# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y
