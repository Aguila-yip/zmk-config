# ==============================================================================
#                  Allium58 / Lily58 零延遲極速省電設定檔
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 深度睡眠管理 (徹底解決一日冇電問題，同時保持秒連)
# ------------------------------------------------------------------------------
# 開啟深層休眠功能（鍵盤長期冇用時自動徹底瞓覺）
CONFIG_ZMK_SLEEP=y

# 閒置 30 秒 (30000 ms) 冇撳掣，進入輕度待機（秒速喚醒）
CONFIG_ZMK_IDLE_TIMEOUT=30000

# 閒置 15 分鐘 (900000 ms) 完全冇摸過，進入深度睡眠（耗電降至微安級）
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# 電量每 2 個鐘（7200 秒）向電腦回報一次，避免頻繁發射浪費電力
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=7200


# ------------------------------------------------------------------------------
# 2. 藍牙發射功率推至最強 (+8 dBm)
# ------------------------------------------------------------------------------
# 增強訊號穿透力，防止因金屬、桌面阻擋而出現斷線或吞字
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y


# ------------------------------------------------------------------------------
# 3. 極速打字響應與防連點 (Debounce)
# ------------------------------------------------------------------------------
# 按下瞬間防抖延遲設為 1ms (電競級極速響應，按下瞬間零延遲出字)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1

# 釋放防抖延遲設為 10ms (防止機械軸彈簧回彈時出現雙擊 Bug)
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10


# ------------------------------------------------------------------------------
# 4. 滑鼠與鼠標功能 (安全開啟)
# ------------------------------------------------------------------------------
# 開啟滑鼠驅動引擎（支援 &mmv 游標移動 及 &mkp 左右掣）
CONFIG_ZMK_POINTING=y


# ------------------------------------------------------------------------------
# 5. 防漏電與關閉無用程序 (極致省電)
# ------------------------------------------------------------------------------
# 徹底關閉 RGB 燈光及背光驅動（防止背景運算浪費電力）
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n


# ------------------------------------------------------------------------------
# 6. ZMK Studio 網頁改掣 (⚠️ 繼續保持關閉！)
# ------------------------------------------------------------------------------
# 保持關閉，防止再次觸發 NVS 暫存覆蓋主記憶體、導致按鍵變 &none 的 Bug！
# CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=n


# ------------------------------------------------------------------------------
# 7. USB 除錯日誌 (保持關閉)
# ------------------------------------------------------------------------------
# 關閉 USB Log，防止晶片因頻繁輸出 Log 而嚴重耗電及拖慢反應
# CONFIG_ZMK_USB_LOGGING=y
